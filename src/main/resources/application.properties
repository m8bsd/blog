spring.application.name=blog
server.port=8080

# In-memory H2 database (data resets on restart)
spring.datasource.url=jdbc:h2:mem:blogdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Admin login. Change the password, or set the BLOG_ADMIN_PASSWORD environment variable.
blog.admin.username=${BLOG_ADMIN_USERNAME:admin}
blog.admin.password=${BLOG_ADMIN_PASSWORD:changeme}
