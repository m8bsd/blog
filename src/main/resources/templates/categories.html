<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Categories - My Blog</title>
</head>
<body>
<section class="container">
    <div class="card">
        <h2>Categories</h2>

        <p th:if="${#lists.isEmpty(categories)}" class="empty">No categories yet.</p>

        <ul class="cat-list">
            <li th:each="c : ${categories}">
                <span th:text="${c.name}">Name</span>
                <form th:action="@{/categories/{id}/delete(id=${c.id})}" method="post"
                      onsubmit="return confirm('Delete this category? Its posts will become uncategorised.');">
                    <button type="submit" class="btn danger small">Delete</button>
                </form>
            </li>
        </ul>
    </div>

    <div class="card">
        <h3>Add a category</h3>
        <form th:action="@{/categories}" th:object="${category}" method="post">
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}">
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</div>
            </div>
            <button type="submit" class="btn">Add</button>
        </form>
    </div>
</section>
</body>
</html>
