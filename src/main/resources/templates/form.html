<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${post.id == null ? 'New post' : 'Edit post'} + ' - My Blog'">Post form</title>
</head>
<body>
<section class="container">
    <div class="card">
        <h2 th:text="${post.id == null} ? 'New post' : 'Edit post'">New post</h2>

        <form th:action="${post.id == null} ? @{/posts} : @{/posts/{id}(id=${post.id})}"
              th:object="${post}" method="post">

            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}">
                <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">error</div>
            </div>

            <div class="field">
                <label for="author">Author</label>
                <input type="text" id="author" th:field="*{author}">
                <div class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">error</div>
            </div>

            <div class="field">
                <label for="categoryId">Category</label>
                <select id="categoryId" name="categoryId">
                    <option value="">None</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${categoryId != null and categoryId == c.id}">Category</option>
                </select>
            </div>

            <div class="field">
                <label for="content">Content</label>
                <textarea id="content" th:field="*{content}"></textarea>
                <div class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">error</div>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Save</button>
                <a class="btn secondary" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
